<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#dc2626" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer accent rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="10 14" opacity="0.4" />
  
  <!-- Red glowing badge container -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#1e1b2e" stroke="url(#red-glow)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Big Sharp #C -->
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle">
    <tspan fill="#ef4444">#</tspan>C
  </text>
  
  <!-- CODE9 banner at bottom -->
  <rect x="136" y="325" width="240" height="46" rx="12" fill="#dc2626" />
  <text x="256" y="356" font-family="monospace, Courier" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    CODE9 WITH HARI
  </text>
</svg>
